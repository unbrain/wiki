  <g>
    <rect x="664" y="48" width="488" height="308" rx="16" fill="#171f33" stroke="#3b4a70" stroke-width="1.5"/>
    <circle cx="690" cy="76" r="4" fill="#ffb84b"/>
    <text x="704" y="81" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b96b3">note.md — 1. 两数之和</text>
    <text x="1128" y="81" text-anchor="end" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="600" fill="#5b8cff">题解 · 哈希表</text>
    <line x1="688" y1="96" x2="1128" y2="96" stroke="#2a3552" stroke-width="1.5"/>

    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16.5">
      <text x="688" y="128" fill="#eef1f8">function <tspan fill="#ffb84b">twoSum</tspan><tspan fill="#eef1f8">(nums, target) {</tspan></text>
      <text x="688" y="154" fill="#eef1f8">  <tspan fill="#ffb84b">const</tspan><tspan fill="#eef1f8"> map = new Map()</tspan></text>
      <text x="688" y="180" fill="#eef1f8">  <tspan fill="#ffb84b">for</tspan><tspan fill="#eef1f8"> (let i = 0; i &lt; nums.length; i++) {</tspan></text>
      <text x="688" y="206" fill="#eef1f8">    <tspan fill="#ffb84b">const</tspan><tspan fill="#eef1f8"> d = target - nums[i]</tspan></text>
      <text x="688" y="232" fill="#eef1f8">    <tspan fill="#ffb84b">if</tspan><tspan fill="#eef1f8"> (map.has(d)) </tspan><tspan fill="#ffb84b">return</tspan><tspan fill="#eef1f8"> [map.get(d), i]</tspan></text>
      <text x="688" y="258" fill="#eef1f8">    map.set(nums[i], i)</text>
      <text x="688" y="284" fill="#eef1f8">  }</text>
    </g>

    <line x1="688" y1="314" x2="1128" y2="314" stroke="#2a3552" stroke-width="1.5"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15">
      <text x="688" y="337" fill="#8b96b3">时间 </text>
      <text x="724" y="337" fill="#4fd1a5">O(n)</text>
      <text x="770" y="337" fill="#8b96b3">空间 </text>
      <text x="806" y="337" fill="#4fd1a5">O(n)</text>
      <text x="860" y="337" fill="#8b96b3">Map 哈希查找</text>
    </g>
  </g>
</svg>